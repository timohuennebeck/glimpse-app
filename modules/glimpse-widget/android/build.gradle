apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'app.glimpse.widget'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle",
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace 'app.glimpse.widget'
  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    // The widget provider and its resources are copied in by the config plugin.
    consumerProguardFiles 'proguard-rules.pro'
  }
  compileSdk safeExtGet('compileSdkVersion', 35)
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
  lintOptions { abortOnError false }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
}
